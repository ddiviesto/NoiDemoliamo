<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>L'avviso "non è il libretto" senza il giallo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#E9ECF3;color:#0F172A}
.nota{background:#05070F;color:#9AA7C4;padding:12px 16px;text-align:center;font-size:12.5px;line-height:1.6}.nota b{color:#fff}
.schede{display:flex;gap:7px;justify-content:center;padding:12px;background:#05070F;position:sticky;top:0;z-index:60;flex-wrap:wrap}
.schede span{font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;border:1.5px solid #232B44;color:#9AA7C4;cursor:pointer}.schede span.qui{background:#fff;color:#05070F;border-color:#fff}
.vista{display:none}.vista.viva{display:block}.spiega{max-width:1120px;margin:0 auto;padding:18px 20px 6px;font-size:14px;color:#4C4A70;line-height:1.7}.spiega b{color:#1E1B4B}
.due{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:10px 20px 40px;flex-wrap:wrap}
.eti{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#6B7280;margin:0 0 8px 4px}
.lilla{background:radial-gradient(900px 460px at 12% -6%,#E4ECFF 0%,rgba(228,236,255,0) 62%),radial-gradient(820px 480px at 92% 24%,#E9E3FF 0%,rgba(233,227,255,0) 62%),#F5F3FE}
.pc{width:620px;border-radius:16px;overflow:hidden;box-shadow:0 16px 44px rgba(15,27,51,.18);border:1px solid #D8DEE9;padding:26px 30px 30px}
.tel{width:375px;border-radius:34px;overflow:hidden;box-shadow:0 16px 44px rgba(15,27,51,.22);border:8px solid #0F172A;background:#fff;padding:16px}
.col{display:flex;flex-direction:column;gap:12px}
.blu{background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:12px;padding:12px 14px}
.blu .t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#1E3A8A;margin-bottom:8px}
.blu .r{display:flex;gap:8px;font-size:13px;color:#1E3A8A;line-height:1.5;margin-top:5px}.blu .r i{width:6px;height:6px;border-radius:999px;background:#2563eb;flex-shrink:0;margin-top:8px}
.blu .r.forte{font-weight:600;margin-top:0;margin-bottom:6px;padding-bottom:8px;border-bottom:1px solid #BFDBFE}
.scheda{display:flex;align-items:flex-start;gap:11px;background:#EFF6FF;border:1.5px solid #DBEAFE;border-radius:14px;padding:11px 13px}
.scheda .q{width:36px;height:36px;border-radius:11px;background:#DBEAFE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scheda .k{font-size:13.5px;font-weight:700;color:#0C447C}.scheda .s{font-size:12.5px;color:#1E4E8C;margin-top:2px;line-height:1.45}
.riga{display:flex;align-items:center;gap:8px;font-size:13px;color:#4B5A72;padding:0 4px}
.riga b{color:#0F172A}
.op{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #E5E7EB;border-radius:14px;padding:12px 14px}
.op .i{width:38px;height:38px;border-radius:11px;background:#DBEAFE;flex-shrink:0}.op .l{font-size:14px;font-weight:600}.op .s{font-size:12px;color:#6B7280;margin-top:1px}
.op .o{width:20px;height:20px;border-radius:999px;border:1.5px solid #D1D5DB;margin-left:auto;flex-shrink:0}
</style></head><body>
<div class="nota"><b>"NON È IL LIBRETTO", SENZA IL GIALLO</b> · l'avviso è importante (tanti lo confondono) ma il giallo nel tema è da allarme ed è bocciato. Tre modi in blu, su PC e telefono.</div>
<div class="schede">
<span class="qui" onclick="vista('a',this)">A · prima riga del riquadro "Come capire quale hai"</span>
<span onclick="vista('b',this)">B · scheda blu col quadratino, sopra</span>
<span onclick="vista('c',this)">C · riga sobria sotto il titolo</span>
</div>
<div id="viste"></div>
<script>
const INFO='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
const DOCX='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9.5" y1="12.5" x2="14.5" y2="17.5"/><line x1="14.5" y1="12.5" x2="9.5" y2="17.5"/></svg>'
const righe=`<div class="r"><i></i><span>Passaggio di proprietà <b>prima di ottobre 2015</b>: foglio <b>cartaceo</b> con stemma ACI in alto.</span></div><div class="r"><i></i><span>Passaggio <b>dopo ottobre 2015</b>: è <b>digitale</b>, non esiste un foglio da conservare.</span></div>`
const opzioni=`<div class="op"><span class="i"></span><div><div class="l">Il mio è digitale</div><div class="s">Passaggio dopo ottobre 2015: il certificato è negli archivi del PRA</div></div><span class="o"></span></div><div class="op"><span class="i"></span><div><div class="l">Sì, ho quello cartaceo</div><div class="s">Il foglio con lo stemma ACI in alto: va consegnato al ritiro</div></div><span class="o"></span></div>`
const A=`<div class="blu"><div class="t">${INFO} Come capire quale hai</div><div class="r forte"><i></i><span><b>Non è il libretto di circolazione</b>: è un documento a parte.</span></div>${righe}</div>`
const B=`<div class="scheda"><span class="q">${DOCX}</span><div><div class="k">Non è il libretto di circolazione</div><div class="s">È un documento a parte: molti li confondono.</div></div></div><div class="blu"><div class="t">${INFO} Come capire quale hai</div>${righe}</div>`
const C=`<div class="riga">${INFO}<span><b>Non è il libretto</b>: è un documento a parte.</span></div><div class="blu"><div class="t">${INFO} Come capire quale hai</div>${righe}</div>`
const coppia=(x)=>`<div class="due"><div><div class="eti">Su PC (colonna destra del passo)</div><div class="pc lilla"><div class="col">${x}${opzioni}</div></div></div><div><div class="eti">Sul telefono</div><div class="tel"><div class="col">${x}${opzioni}</div></div></div></div>`
const V={
 a:{s:'<b>A.</b> L’avviso <b>entra nel riquadro blu</b> "Come capire quale hai" come prima riga, in evidenza, con un filo sotto: "Non è il libretto di circolazione: è un documento a parte". Un riquadro solo, niente giallo, e la spiegazione segue subito. La più ordinata.', h:coppia(A)},
 b:{s:'<b>B.</b> L’avviso resta <b>un pezzo a sé</b>, sopra, ma nella veste blu della famiglia degli avvisi: quadratino azzurro con l’icona del documento, titolo e riga. Più visibile della A, due riquadri uno sopra l’altro.', h:coppia(B)},
 c:{s:'<b>C.</b> La più leggera: <b>una riga sobria</b> senza riquadro, iconcina "i" e testo, sopra il riquadro blu. Si vede meno, ma non pesa.', h:coppia(C)},
}
const viste=document.getElementById('viste');for(const k of Object.keys(V))viste.insertAdjacentHTML('beforeend',`<div class="vista ${k==='a'?'viva':''}" id="vista-${k}"><div class="spiega">${V[k].s}</div>${V[k].h}</div>`)
function vista(k,el){document.querySelectorAll('.vista').forEach(x=>x.classList.toggle('viva',x.id==='vista-'+k));document.querySelectorAll('.schede span').forEach(x=>x.classList.remove('qui'));el.classList.add('qui')}
</script></body></html>

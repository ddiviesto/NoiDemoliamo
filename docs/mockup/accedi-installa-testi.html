<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Come convincere a installare l'app</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#E9ECF3;color:#0F172A}
.nota{background:#05070F;color:#9AA7C4;padding:12px 16px;text-align:center;font-size:12.5px;line-height:1.6}.nota b{color:#fff}
.schede{display:flex;gap:7px;justify-content:center;padding:12px;background:#05070F;position:sticky;top:0;z-index:60;flex-wrap:wrap}
.schede span{font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;border:1.5px solid #232B44;color:#9AA7C4;cursor:pointer}.schede span.qui{background:#fff;color:#05070F;border-color:#fff}
.vista{display:none}.vista.viva{display:block}.spiega{max-width:1120px;margin:0 auto;padding:18px 20px 6px;font-size:14px;color:#4C4A70;line-height:1.7}.spiega b{color:#1E1B4B}
.due{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:10px 20px 40px;flex-wrap:wrap}
.eti{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#6B7280;margin:0 0 8px 4px}
.lilla{background:radial-gradient(900px 460px at 12% -6%,#E4ECFF 0%,rgba(228,236,255,0) 62%),radial-gradient(820px 480px at 92% 24%,#E9E3FF 0%,rgba(233,227,255,0) 62%),radial-gradient(900px 520px at 30% 104%,#DED6FB 0%,rgba(222,214,251,0) 66%),#F5F3FE}
.pc{width:760px;border-radius:16px;overflow:hidden;box-shadow:0 16px 44px rgba(15,27,51,.18);border:1px solid #D8DEE9;padding:22px 0 34px}
.pc .col{width:600px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:0}
.tel{width:375px;border-radius:34px;overflow:hidden;box-shadow:0 16px 44px rgba(15,27,51,.22);border:8px solid #0F172A;background:#fff}
.isola{width:100%;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(15,27,51,.10);border-radius:999px;padding:8px 8px 8px 20px;margin-bottom:26px}
.marchio{font-family:Outfit,sans-serif;font-size:20px;letter-spacing:-.035em}.marchio .noi{font-weight:500;color:#46536B}.marchio .dem{font-weight:800;color:#0F1B33;margin-left:.15em}
.marchio.ch .noi{color:#BFD3F5}.marchio.ch .dem{color:#fff}.marchio.s{font-size:17px}
.pill{font-size:12.5px;font-weight:700;color:#1D4ED8;background:#EFF6FF;border:1px solid #DBEAFE;border-radius:999px;padding:8px 14px}
.scatola{width:100%;max-width:400px;background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(15,27,51,.10);overflow:hidden}
.tel .scatola{max-width:none;border-radius:0;box-shadow:none}
.testa{position:relative;color:#fff;padding:14px 16px 48px;background:linear-gradient(120deg,#1d4ed8 0%,#2563eb 55%,#3b82f6 100%)}
.testa .ind{width:38px;height:38px;border-radius:999px;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-right:10px}
.testa h1{margin:16px 0 0;font-size:22px;font-weight:700}.testa p{margin:4px 0 0;font-size:13px;color:#DBEAFE}
.testa .ic{position:absolute;left:24px;bottom:-37px;width:74px;height:74px;border-radius:20px;background:#fff;box-shadow:0 8px 20px rgba(16,24,40,.18);display:flex;align-items:center;justify-content:center;overflow:hidden}
.corpo{padding:56px 24px 28px}
.lab{font-size:12px;font-weight:600;color:#374151;margin:0 0 6px 4px}
.campo{display:flex;align-items:center;gap:10px;border-radius:999px;padding:13px 18px;background:#F9FAFB;border:1.5px solid #E5E7EB;font-size:15px;color:#9CA3AF;margin-bottom:16px}
.dim{text-align:right;font-size:13px;font-weight:600;color:#2563eb;margin:-8px 4px 18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(90deg,#1d4ed8,#2563eb);color:#fff;border-radius:999px;padding:15px 0;font-size:15px;font-weight:600;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.btnp{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(90deg,#1d4ed8,#2563eb);color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(37,99,235,.3);white-space:nowrap}
/* A: striscia di vetro sotto la scatola */
.striscia{width:100%;max-width:400px;margin-top:16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(231,235,243,.9);border-radius:18px;padding:12px 14px}
.striscia .q{width:42px;height:42px;border-radius:12px;overflow:hidden;flex-shrink:0;box-shadow:0 3px 9px rgba(15,27,51,.12)}
.striscia .t{font-size:13.5px;font-weight:700;color:#111827}.striscia .s{font-size:11.5px;color:#6B7280;margin-top:1px}
.tel .striscia{margin:0 16px 20px;max-width:none;width:auto;background:#F5F3FE;border-color:#E6E3F7}
/* B: riga dentro la scatola */
.rigab{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid #EEF1F5;font-size:13px;color:#6B7280}
.rigab a{color:#2563eb;font-weight:700;text-decoration:underline}
/* C: card grande come in home */
.grande{width:100%;max-width:400px;margin-top:16px;display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(231,235,243,.9);border-radius:22px;padding:18px 20px}
.grande .fone{flex-shrink:0;width:64px;height:124px;border-radius:14px;border:4px solid #0F172A;background:linear-gradient(160deg,#1e293b,#0f172a);padding:12px 6px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 4px;align-content:start}
.grande .fone span{display:block;width:18px;height:18px;border-radius:5px;background:#94A3B8;opacity:.45;margin:0 auto}.grande .fone .ico{opacity:1;background:none;overflow:hidden}
.grande .occ{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#2563eb}
.grande h3{margin:4px 0 0;font-size:16px;font-weight:700;color:#0F1B33;line-height:1.2}.grande p{margin:5px 0 0;font-size:12.5px;color:#5B6779;line-height:1.5}
.tel .grande{margin:0 16px 20px;max-width:none;width:auto;background:#F5F3FE;border-color:#E6E3F7}
.spunte{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:7px}.spunte span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#374151}.spunte i{width:15px;height:15px;border-radius:999px;background:#DCF3E4;color:#1F7A43;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-style:normal}.striscia{align-items:flex-start}.striscia .btnp{align-self:center}
.ico-app{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body>
<div class="nota"><b>COME CONVINCERLI</b> · la striscia (A) sotto l'accesso con tre modi di dire perché conviene l'app. Tutto vero: niente promesse che l'app non mantiene ancora.</div>
<div class="schede">
<span class="qui" onclick="vista('a',this)">1 · "Con l’app fai prima"</span>
<span onclick="vista('b',this)">2 · Tre vantaggi a spunte</span>
<span onclick="vista('c',this)">3 · "Hai già l’app?"</span>
</div>
<div id="viste"></div>
<script>
const SC='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
const FR='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>'
const ICO='<img class="ico-app" src="/icona-app.png" alt="">'
const marchio=(ch)=>`<span class="marchio ${ch?'ch s':''}"><span class="noi">Noi</span><span class="dem">Demoliamo</span></span>`

const base=(t,s,spunte)=>`<div class="striscia"><span class="q">${ICO}</span><div style="flex:1;min-width:0"><div class="t">${t}</div><div class="s">${s}</div>${spunte?`<div class="spunte">${spunte.map(x=>`<span><i>✓</i>${x}</span>`).join('')}</div>`:''}</div><span class="btnp">${SC} Installa l’app</span></div>`
const s1=base('Con l’app fai prima','Apri la tua pratica con un tocco, fotografi i documenti direttamente e vedi subito a che punto sei. Gratis, senza store.')
const s2=base('Con l’app è tutto più facile','Si installa dal sito in un tocco, gratis.',['Documenti fotografati al volo','La pratica sempre a portata di mano','A tutto schermo, senza browser'])
const s3=base('Hai già l’app?','È il modo più comodo di seguire la pratica: icona sul telefono, foto dei documenti al volo e lo stato sempre sott’occhio. Gratis, senza store.')
const rigab=`<div class="rigab">${SC.replace('currentColor','#6B7280')} Vuoi l’icona sul telefono? <a>Installa l’app</a></div>`
const grande=`<div class="grande"><div class="fone"><span></span><span></span><span class="ico">${ICO}</span><span></span><span></span><span></span></div><div style="flex:1;min-width:0"><div class="occ">L’app</div><h3>Porta NoiDemoliamo nella tua home</h3><p>Si installa dal sito, senza store. Gratis, su iPhone, Android e PC.</p><div style="margin-top:10px"><span class="btnp">${SC} Installa l’app</span></div></div></div>`

function scatola(dentro, tel){
  return `<div class="scatola"><div class="testa"><span class="ind">${FR}</span>${marchio(true)}<h1>Bentornato</h1><p>Entra nella tua area personale</p><span class="ic">${ICO}</span></div>
  <div class="corpo"><div class="lab">Email</div><div class="campo">nome@email.it</div><div class="lab">Password</div><div class="campo">La tua password</div><div class="dim">Password dimenticata?</div><div class="btn">Accedi</div>${dentro||''}</div></div>`
}
function pc(sotto, dentro){
  return `<div class="pc lilla"><div class="col"><div class="isola">${marchio(false)}<span class="pill">Torna al sito</span></div>${scatola(dentro)}${sotto||''}</div></div>`
}
function tel(sotto, dentro){
  return `<div class="tel">${scatola(dentro,true)}${sotto||''}</div>`
}
function coppia(sotto, dentro){
  return `<div class="due"><div><div class="eti">Su PC</div>${pc(sotto,dentro)}</div><div><div class="eti">Sul telefono</div>${tel(sotto,dentro)}</div></div>`
}
const V={
 a:{s:'<b>1. "Con l’app fai prima".</b> Un titolo che parla di tempo (il cliente vuole sbrigarsi) e una riga sola con i tre fatti veri: si apre con un tocco, fotografi i documenti direttamente, vedi a che punto sei. Chiude con "Gratis, senza store", che toglie la paura di dover scaricare chissà cosa.', h:coppia(s1)},
 b:{s:'<b>2. Tre vantaggi a spunte.</b> Lo stesso messaggio ma a colpo d’occhio: titolo breve e tre spunte verdi, come nella sezione della home. Si legge anche senza leggere. È il modo più "da vetrina".', h:coppia(s2)},
 c:{s:'<b>3. "Hai già l’app?"</b> Una domanda, che fa sentire l’app come una cosa normale che gli altri hanno già. Poi i tre fatti e "Gratis, senza store". Tono più amichevole, meno pubblicitario.', h:coppia(s3)},
}
const viste=document.getElementById('viste');for(const k of Object.keys(V))viste.insertAdjacentHTML('beforeend',`<div class="vista ${k==='a'?'viva':''}" id="vista-${k}"><div class="spiega">${V[k].s}</div>${V[k].h}</div>`)
function vista(k,el){document.querySelectorAll('.vista').forEach(x=>x.classList.toggle('viva',x.id==='vista-'+k));document.querySelectorAll('.schede span').forEach(x=>x.classList.remove('qui'));el.classList.add('qui')}
</script></body></html>

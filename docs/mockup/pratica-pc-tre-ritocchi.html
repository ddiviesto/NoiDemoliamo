<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Tessere compatte, lista semplice, tasto come sul telefono</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#E9ECF3;color:#0F172A}
.nota{background:#05070F;color:#9AA7C4;padding:12px 16px;text-align:center;font-size:12.5px;line-height:1.6}.nota b{color:#fff}
.schede{display:flex;gap:7px;justify-content:center;padding:12px;background:#05070F;position:sticky;top:0;z-index:60;flex-wrap:wrap}
.schede span{font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;border:1.5px solid #232B44;color:#9AA7C4;cursor:pointer}.schede span.qui{background:#fff;color:#05070F;border-color:#fff}
.vista{display:none}.vista.viva{display:block}.spiega{max-width:1120px;margin:0 auto;padding:18px 20px 6px;font-size:14px;color:#4C4A70;line-height:1.7}.spiega b{color:#1E1B4B}
.schermo{width:1280px;margin:14px auto 40px;border-radius:16px;overflow:hidden;box-shadow:0 16px 44px rgba(15,27,51,.18);border:1px solid #D8DEE9;background:radial-gradient(900px 460px at 12% -6%,#E4ECFF 0%,rgba(228,236,255,0) 62%),radial-gradient(820px 480px at 92% 24%,#E9E3FF 0%,rgba(233,227,255,0) 62%),radial-gradient(900px 520px at 30% 104%,#DED6FB 0%,rgba(222,214,251,0) 66%),#F5F3FE;padding:28px 0 40px}
.col{margin:0 auto;display:flex;flex-direction:column;gap:18px;width:1000px}
.isola{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(15,27,51,.10);border-radius:999px;padding:8px 8px 8px 20px}
.marchio{font-family:Outfit,sans-serif;font-size:20px;letter-spacing:-.035em}.marchio .noi{font-weight:500;color:#46536B}.marchio .dem{font-weight:800;color:#0F1B33;margin-left:.15em}
.pill{font-size:12.5px;font-weight:700;color:#1D4ED8;background:#EFF6FF;border:1px solid #DBEAFE;border-radius:999px;padding:8px 14px}
.riga{display:flex;align-items:center;gap:16px}.indietro{width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(226,232,245,.9);box-shadow:0 6px 16px rgba(15,27,51,.07);display:flex;align-items:center;justify-content:center}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.9px;line-height:1.1}h1 span{color:#1D4ED8}.meta{font-size:14px;color:#4B5A72;margin-top:4px}
h1.grande{font-size:36px;letter-spacing:-1.2px}.sotto{font-size:15px;color:#4B5A72;margin-top:6px}
.stato{font-size:11px;font-weight:700;color:#1D4ED8;background:#EFF6FF;border-radius:999px;padding:6px 12px;white-space:nowrap}
.tabs{display:flex;gap:8px;background:rgba(255,255,255,.7);border:1px solid rgba(226,232,245,.9);border-radius:999px;padding:6px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 14px;font-size:13.5px;font-weight:600;color:#4B5563}.tab.on{background:#2563EB;color:#fff;font-weight:700}
.tab .n{background:#fff;color:#1D4ED8;font-size:11px;border-radius:999px;padding:1px 7px}
.fare{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid #DBEAFE;border-radius:16px;padding:12px 16px;box-shadow:0 2px 8px rgba(37,99,235,.08)}
.fare .ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#2563eb);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.fare .occ{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#1D4ED8}.fare .t{font-size:15px;font-weight:700;margin-top:2px}.fare .s{font-size:12.5px;color:#4B5A72;margin-top:2px}
.sopra{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.8px;color:#6B7280}
.sopra .doc{background:#EFF6FF;color:#1D4ED8;border-radius:999px;padding:3px 10px;letter-spacing:0}
.card{background:#fff;border:1.5px solid #E5E7EB;border-radius:18px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 5px 14px rgba(16,24,40,.07);overflow:hidden}
.card .testa{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #EEF1F5}
.card .testa i{width:42px;height:42px;border-radius:12px;background:#DBEAFE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card .testa b{display:block;font-size:16px}.card .testa small{font-size:12.5px;color:#6B7280}
.tess{display:flex;gap:14px;padding:16px 18px}
.t1{border:1.5px solid #E5E9F0;border-radius:14px;overflow:hidden;background:#F5F7FB;flex:1;min-width:0}
.t1.fissa{flex:0 0 300px}
.t1 .cap{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #E5E9F0;font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#4B5A72}
.t1 .cap b{width:20px;height:20px;border-radius:999px;background:#2563EB;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.t1 .cap b.g{background:#EDF0F5;color:#64748B}
.t1 .dentro{display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:center}
.t1.attesa{background:#FAFBFD}.t1.attesa .cap{color:#64748B}
.btn{background:linear-gradient(90deg,#1d4ed8,#2563eb);color:#fff;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:600;box-shadow:0 6px 18px rgba(37,99,235,.3)}
.hint{font-size:12px;color:#6B7280}
.piede{display:flex;align-items:center;justify-content:center;padding:11px 18px;border-top:1px solid #EEF1F5;background:#FAFBFD;font-size:12.5px;color:#6B7280}
.piede a{color:#1D4ED8;font-weight:600;text-decoration:underline;margin-left:4px}
.spento{display:inline-block;background:#E5E7EB;color:#9CA3AF;border-radius:999px;padding:14px 40px;font-size:15px;font-weight:600;align-self:flex-start}
.elenco{display:flex;flex-direction:column;gap:9px;padding:2px 10px 0}
.elenco div{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#6B7280}
.elenco b{width:22px;height:22px;border-radius:999px;background:#EDF0F5;color:#64748B;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.elenco .eti{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#6B7280;margin-bottom:2px}
/* home */
.prat{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid #E5E7EB;border-radius:16px;padding:14px 18px;box-shadow:0 1px 3px rgba(16,24,40,.07);position:relative;overflow:hidden}
.prat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#2563EB}
.prat .q{width:50px;height:50px;border-radius:14px;background:#DBEAFE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prat .z{flex:1;min-width:0;border-left:1px solid #EEF1F5;padding-left:16px}.prat .z:first-of-type{border:none;padding:0}
.prat .k{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#6B7280}.prat .v{font-size:13.5px;font-weight:600;color:#374151;margin-top:2px}.prat .d{font-size:12.5px;color:#6B7280;margin-top:2px}
.prat .targa{font-size:16px;font-weight:700}.prat .mod{font-size:12.5px;color:#6B7280;margin-top:2px}
.prat .st{display:inline-block;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;background:#EFF6FF;color:#1D4ED8}.prat .fai{font-size:12.5px;font-weight:600;color:#1D4ED8;margin-top:5px}
.agg{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #E5E7EB;border-radius:16px;padding:12px 14px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.agg .piu{width:40px;height:40px;border-radius:12px;background:#2563EB;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px rgba(37,99,235,.25);flex-shrink:0}
.agg .t{font-size:13.5px;font-weight:600;color:#111827}.agg .s{font-size:11.5px;color:#6B7280;margin-top:1px}
</style></head><body>
<div class="nota"><b>TRE RITOCCHI</b> · il tasto "Aggiungi un altro veicolo" come sul telefono, le tessere fronte/retro uguali e più compatte, e sotto solo la lista dei documenti senza il riquadro.</div>
<div class="schede">
<span class="qui" onclick="vista('h',this)">Home · tasto come sul telefono</span>
<span onclick="vista('a',this)">A · tessere uguali a tutta card</span>
<span onclick="vista('b',this)">B · tessere compatte a sinistra</span>
<span onclick="vista('c',this)">C · tessere compatte al centro</span>
</div>
<div id="viste"></div>
<script>
const FR='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2E6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>'
const UP='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>'
const DOC='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
const AUTO='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h-2v-5l2-5h12l3 5v5h-2"/><circle cx="7.5" cy="17.5" r="2"/><circle cx="16.5" cy="17.5" r="2"/></svg>'
const PIU='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'
const CHEV='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
const tondo=(c)=>`<span style="width:44px;height:44px;border-radius:999px;background:#fff;border:1.5px solid ${c};display:flex;align-items:center;justify-content:center">${UP}</span>`
const tess=(lab,n,attiva,h,fissa)=>`<div class="t1 ${attiva?'':'attesa'} ${fissa?'fissa':''}"><div class="cap"><b class="${attiva?'':'g'}">${n}</b>${lab}</div><div class="dentro" style="min-height:${h}px;padding:16px">${tondo(attiva?'#DBEAFE':'#E5E9F0')}${attiva?'<span class="btn">Scegli dal dispositivo</span><span class="hint">oppure trascina qui l’immagine</span>':'<span class="hint">Dopo il fronte</span>'}</div></div>`

function testa(){return `<div class="isola"><span class="marchio"><span class="noi">Noi</span><span class="dem">Demoliamo</span></span><span style="display:flex;gap:10px"><span class="pill">Le tue pratiche</span><span class="pill">Esci</span></span></div>
<div class="riga"><span class="indietro">${FR}</span><div style="flex:1"><h1>CK456ZY <span>Fiat Panda</span></h1><div class="meta">Autovettura · Via Roma 10, Milano · richiesta del 05 ott 2026</div></div><span class="stato">In attesa documenti</span></div>
<div class="tabs"><span class="tab on">Documenti <span class="n">1/4</span></span><span class="tab">Ritiro</span><span class="tab">Stato</span><span class="tab">Chat</span></div>
<div class="fare"><span class="ic">${DOC.replace('#2563eb','#fff')}</span><div><div class="occ">Cosa fare adesso</div><div class="t">Carica i tuoi documenti</div><div class="s">Un documento alla volta: bastano le foto. Li controlliamo noi e ti diciamo subito se va tutto bene.</div></div></div>`}

function documenti(modo){
  const h = modo==='a'?150:130
  const fissa = modo!=='a'
  const just = modo==='c'?'center':'flex-start'
  return `<div class="schermo"><div class="col">${testa()}
    <div class="sopra"><span>DA PREPARARE</span><span class="doc">Documento 1 di 4</span></div>
    <div class="card"><div class="testa"><i>${DOC}</i><div><b>Libretto di circolazione</b><small>Due immagini: il fronte e il retro. Va bene anche una foto fatta col telefono.</small></div></div>
      <div class="tess" style="justify-content:${just}">${tess('Fronte',1,true,h,fissa)}${tess('Retro',2,false,h,fissa)}</div>
      <div class="piede">Hai una scansione o un PDF con fronte e retro insieme?<a>Allega il file</a></div></div>
    <span class="spento">Vai al prossimo documento</span>
    <div class="elenco"><div class="eti">Dopo questo</div><div><b>2</b>Carta d’identità del proprietario</div><div><b>3</b>Tessera sanitaria del proprietario</div><div><b>4</b>Dichiarazione Inutilizzabilità Ente Pubblico</div></div>
  </div></div>`
}

function home(){
  return `<div class="schermo"><div class="col">
    <div class="isola"><span class="marchio"><span class="noi">Noi</span><span class="dem">Demoliamo</span></span><span style="display:flex;gap:10px;align-items:center"><span style="font-size:13px;color:#4B5A72">Ciao, Davide</span><span class="pill">Esci</span></span></div>
    <div><h1 class="grande">Le tue <span>pratiche</span></h1><div class="sotto">1 pratica attiva</div></div>
    <div class="prat"><span class="q">${AUTO}</span><div class="z"><div class="targa">CK456ZY</div><div class="mod">Fiat Panda · Autovettura</div></div><div class="z"><div class="k">Dove si trova</div><div class="v">Via Roma 10, Milano</div><div class="d">Richiesta del 05 ott 2026</div></div><div class="z"><span class="st">In attesa documenti</span><div class="fai">Carica i documenti →</div></div>${CHEV}</div>
    <div class="agg"><span class="piu">${PIU}</span><div style="flex:1"><div class="t">Aggiungi un altro veicolo</div><div class="s">Sempre gratis, come la prima</div></div>${CHEV}</div>
  </div></div>`
}

const V={
 h:{s:'<b>Home.</b> Il tasto "Aggiungi un altro veicolo" è <b>la stessa riga del telefono</b>: card bianca a tutta larghezza sotto le pratiche, quadratino blu col +, "Sempre gratis, come la prima", freccina a destra. Via la pillola blu centrata.', h:home()},
 a:{s:'<b>A.</b> Le due tessere <b>uguali</b>, che riempiono la card (è così che doveva già apparire: nel tuo screenshot la veste non era ancora caricata). Più basse di prima (150). Sotto: via il riquadro, resta <b>la lista semplice "Dopo questo"</b> coi numerini, come sul telefono.', h:documenti('a')},
 b:{s:'<b>B.</b> Tessere <b>compatte</b> (300 x 130) e uguali, allineate <b>a sinistra</b> sotto il nome del documento. La card resta larga ma le tessere non si allargano con lei. Stessa lista sotto.', h:documenti('b')},
 c:{s:'<b>C.</b> Stesse tessere compatte della B ma <b>al centro</b> della card, come due foto in cornice. Stessa lista sotto.', h:documenti('c')},
}
const viste=document.getElementById('viste');for(const k of Object.keys(V))viste.insertAdjacentHTML('beforeend',`<div class="vista ${k==='h'?'viva':''}" id="vista-${k}"><div class="spiega">${V[k].s}</div>${V[k].h}</div>`)
function vista(k,el){document.querySelectorAll('.vista').forEach(x=>x.classList.toggle('viva',x.id==='vista-'+k));document.querySelectorAll('.schede span').forEach(x=>x.classList.remove('qui'));el.classList.add('qui')}
</script></body></html>

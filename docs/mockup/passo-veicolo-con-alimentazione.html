<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il passo 3 con l'alimentazione dentro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0F172A; background: #E9ECF3; }
  .nota { background: #05070F; color: #9AA7C4; padding: 12px 16px; text-align: center; font-size: 12.5px; line-height: 1.6; }
  .nota b { color: #fff; }
  .schede { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; padding: 12px; background: #05070F; position: sticky; top: 0; z-index: 60; }
  .schede span { font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 999px; border: 1.5px solid #232B44; color: #9AA7C4; cursor: pointer; }
  .schede span.qui { background: #fff; color: #05070F; border-color: #fff; }
  .vista { display: none; } .vista.viva { display: block; }
  .spiega { max-width: 1120px; margin: 0 auto; padding: 20px 20px 0; font-size: 14.5px; color: #4C4A70; line-height: 1.7; }
  .spiega b { color: #1E1B4B; }

  .schermo { max-width: 1180px; margin: 14px auto 30px; border-radius: 16px; overflow: hidden; box-shadow: 0 16px 44px rgba(15,27,51,.18); border: 1px solid #D8DEE9; }
  .barra-url { background: #E8EDF5; padding: 8px 14px; display: flex; align-items: center; gap: 9px; }
  .barra-url i { width: 9px; height: 9px; border-radius: 999px; background: #C6CFDC; display: block; }
  .barra-url .url { flex: 1; background: #fff; border: 1px solid #D8E0EC; border-radius: 999px; padding: 4px 12px; font-size: 11.5px; color: #5B6779; }
  .scena { min-height: 560px; padding: 22px 28px 40px;
    background: radial-gradient(900px 460px at 12% -6%, #E4ECFF 0%, rgba(228,236,255,0) 62%),
                radial-gradient(820px 480px at 92% 24%, #E9E3FF 0%, rgba(233,227,255,0) 62%), #F5F3FE; }
  .isola { margin: 0 auto 18px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,.72); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 10px 30px rgba(15,27,51,.10); border-radius: 999px; padding: 8px 8px 8px 20px; }
  .marchio { font-family: 'Outfit', sans-serif; font-size: 20px; letter-spacing: -.035em; }
  .marchio .noi { font-weight: 500; color: #46536B; } .marchio .dem { font-weight: 800; color: #0F1B33; margin-left: .15em; }
  .isola .pill { font-size: 12px; font-weight: 700; color: #1D4ED8; background: #EFF6FF; border: 1px solid #DBEAFE; border-radius: 999px; padding: 7px 14px; }
  .isola .mezzo { font-size: 12px; font-weight: 600; color: #3E4C63; margin: 0 8px 0 10px; }
  .riga-alta { display: flex; align-items: center; gap: 14px; margin: 0 auto 26px; }
  .riga-alta .indietro { width: 42px; height: 42px; border-radius: 999px; background: rgba(255,255,255,.8); border: 1px solid rgba(226,232,245,.9); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(15,27,51,.07); }
  .riga-alta .barra { flex: 1; height: 5px; background: rgba(15,27,51,.07); border-radius: 999px; overflow: hidden; }
  .riga-alta .barra i { display: block; height: 100%; width: 21%; background: linear-gradient(90deg,#2563eb,#7c3aed); border-radius: 999px; }
  .riga-alta .conta { font-size: 12px; font-weight: 700; color: #7C8AA5; letter-spacing: .4px; white-space: nowrap; }
  .due { display: flex; gap: 40px; align-items: flex-start; }
  .sx { flex: .95; } .dx { flex: 1.05; min-width: 0; }
  .titolone { font-size: 34px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
  .titolone span { background: linear-gradient(90deg,#2563eb,#7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sotto { font-size: 15px; color: #4B5A72; margin-top: 12px; max-width: 420px; line-height: 1.6; }
  .punto { margin-top: 26px; padding-top: 20px; border-top: 1px solid rgba(15,27,51,.08); }
  .punto .eti { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #8A94A3; margin-bottom: 10px; }
  .punto .r { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 14px; color: #7C8AA5; }
  .punto .r b { display: flex; align-items: center; justify-content: center; width: 21px; height: 21px; border-radius: 999px; font-size: 11px; background: rgba(15,27,51,.07); color: #8A94A3; }
  .punto .r.qui { color: #1B2E6B; font-weight: 700; } .punto .r.qui b { background: linear-gradient(135deg,#2563eb,#4f46e5); color: #fff; }

  .campo { margin-bottom: 14px; }
  .campo .eti { display: block; font-size: 12.5px; font-weight: 700; color: #4A5A75; margin-bottom: 6px; padding-left: 16px; }
  .pil { width: 100%; background: #fff; border: 1.5px solid #E2E8F0; border-radius: 999px; padding: 13px 20px; font-size: 15.5px; color: #9AA7BC; box-shadow: 0 2px 6px rgba(15,27,51,.04); }
  .pil.scritto { color: #0F172A; }
  .coppia { display: flex; gap: 14px; } .coppia .campo { flex: 1; }
  /* tutte le pillole uguali: griglia a tre colonne, il cambio ne occupa due, l'alimentazione due righe da tre */
  .scelte { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .scelte span { min-width: 0; text-align: center; background: #fff; border: 1.5px solid #E2E8F0; border-radius: 999px; padding: 11px 14px; font-size: 14px; font-weight: 700; color: #55637A; white-space: nowrap; }
  .scelte span.presa { border-color: #2563EB; background: #EFF6FF; color: #1D4ED8; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .continua { margin-top: 22px; background: linear-gradient(90deg,#1d4ed8,#2563eb); color: #fff; border: none; border-radius: 999px; padding: 15px 40px; font-size: 15px; font-weight: 600; box-shadow: 0 6px 18px rgba(37,99,235,.35); }

  /* telefono */
  .telefoni { display: flex; gap: 34px; justify-content: center; flex-wrap: wrap; padding: 6px 20px 50px; }
  .tel { width: 320px; border-radius: 34px; overflow: hidden; border: 9px solid #0F172A; box-shadow: 0 18px 44px rgba(15,27,51,.28); background: #fff; }
  .tel .testata { background: linear-gradient(90deg,#1d4ed8,#2563eb); color: #fff; padding: 11px 14px; display: flex; align-items: center; gap: 10px; }
  .tel .testata .tondo { width: 34px; height: 34px; border-radius: 999px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; }
  .tel .testata .mid { flex: 1; text-align: center; }
  .tel .testata .p { font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; color: #C7D8FF; }
  .tel .testata .b { font-size: 13px; font-weight: 700; }
  .tel .fascetta { background: #EFF6FF; border-bottom: 1px solid #DBEAFE; padding: 8px 14px; font-size: 11.5px; }
  .tel .fascetta b { color: #1D4ED8; } .tel .fascetta span { color: #3E4C63; font-weight: 600; margin-left: 6px; }
  .tel .corpo { padding: 16px 16px 26px; }
  .tel .tit { font-size: 21px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 4px; } .tel .tit span { color: #1D4ED8; }
  .tel .sot { font-size: 13.5px; color: #4B5563; margin-bottom: 16px; }
  .tel .pil { font-size: 16px; }
  /* sul telefono le sei alimentazioni stanno su due righe da tre */
  .tel .scelte { gap: 8px; }
  .tel .scelte span { font-size: 13px; padding: 10px 4px; }
  .tel .continua { width: 100%; margin-top: 16px; padding: 14px 0; }
  .didascalia { text-align: center; font-size: 12.5px; color: #55637A; margin-top: 10px; font-weight: 600; }
</style>
</head>
<body>

<div class="nota"><b>IL PASSO 3 CON L&rsquo;ALIMENTAZIONE DENTRO</b> &middot; niente passo in pi&ugrave;: l&rsquo;alimentazione entra nella stessa schermata di anno, km, marca, modello e cambio. Tre nomi possibili per il passo: clicca le linguette e confronta.</div>
<div class="schede">
  <span class="qui" onclick="vista('a',this)">A &middot; &ldquo;Informazioni sul veicolo&rdquo;</span>
  <span onclick="vista('b',this)">B &middot; &ldquo;Il tuo veicolo&rdquo;</span>
  <span onclick="vista('c',this)">C &middot; &ldquo;Dati del veicolo&rdquo;</span>
</div>

<div id="viste"></div>

<script>
  const ETICHETTE = (nome) => ['Tipo di veicolo', 'Intestazione', nome, 'Condizioni', 'Dove si trova', 'Targa', 'Codice fiscale', 'Foto', 'Fermo amministrativo', 'Chi consegna', 'Libretto', 'Certificato di proprietà', 'Crea il tuo account']

  const modulo = (tel) => `
    <div class="campo"><span class="eti">Anno di immatricolazione</span><div class="pil scritto">2008</div></div>
    <div class="campo"><span class="eti">Chilometri percorsi</span><div class="pil scritto">185.000</div></div>
    <div class="coppia"><div class="campo"><span class="eti">Marca</span><div class="pil scritto">Fiat</div></div><div class="campo"><span class="eti">Modello</span><div class="pil scritto">Panda</div></div></div>
    <div class="campo"><span class="eti">Tipo di cambio</span><div class="scelte"><span class="presa">Manuale</span><span>Automatico</span></div></div>
    <div class="campo"><span class="eti">Alimentazione</span><div class="scelte"><span>Benzina</span><span class="presa">Diesel</span><span>GPL</span><span>Metano</span><span>Ibrida</span><span>Elettrica</span></div></div>
    <button class="continua">Continua</button>`

  function pc(titolo, sotto, nome) {
    const et = ETICHETTE(nome)
    const lista = et.slice(2, 6).map((e, i) => `<div class="r ${i === 0 ? 'qui' : ''}"><b>${3 + i}</b>${e}</div>`).join('')
    return `<div class="schermo">
      <div class="barra-url"><i></i><i></i><i></i><span class="url">noidemoliamo.it/inizia</span></div>
      <div class="scena">
        <div class="isola">
          <span class="marchio"><span class="noi">Noi</span><span class="dem">Demoliamo</span></span>
          <span><span class="pill">Richiesta demolizione gratuita</span><span class="mezzo">Autovettura</span></span>
        </div>
        <div class="riga-alta">
          <span class="indietro"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2E6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span>
          <span class="barra"><i></i></span>
          <span class="conta">PASSO 3 DI 13</span>
        </div>
        <div class="due">
          <div class="sx">
            <div class="titolone">${titolo}</div>
            <div class="sotto">${sotto}</div>
            <div class="punto"><div class="eti">A che punto sei</div>${lista}<div class="r"><b>&hellip;</b>altri 7 passi</div></div>
          </div>
          <div class="dx">${modulo(false)}</div>
        </div>
      </div>
    </div>`
  }

  function telefono(titolo, sotto, nome) {
    return `<div class="telefoni"><div>
      <div class="tel">
        <div class="testata">
          <span class="tondo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span>
          <span class="mid"><span class="p">PASSO 3 DI 13</span><br><span class="b">${nome}</span></span>
          <span style="width:34px"></span>
        </div>
        <div class="fascetta"><b>Richiesta demolizione gratuita</b><span>Autovettura</span></div>
        <div class="corpo">
          <div class="tit">${titolo}</div>
          <div class="sot">${sotto}</div>
          ${modulo(true)}
        </div>
      </div>
      <div class="didascalia">Sul telefono: l&rsquo;alimentazione va su due righe da tre</div>
    </div></div>`
  }

  const SOTTO = 'Anno, km, marca, modello, cambio e alimentazione.'
  const varianti = {
    a: { nome: 'Informazioni sul veicolo', titolo: 'Informazioni <span>sull&rsquo;autovettura</span>',
         dice: 'Il nome pi&ugrave; completo: dice che qui si raccolgono i dati del mezzo, tutti insieme. Nella colonna &ldquo;A che punto sei&rdquo; e nella testata del telefono compare cos&igrave;.' },
    b: { nome: 'Il tuo veicolo', titolo: 'La tua <span>autovettura</span>',
         dice: 'Il pi&ugrave; corto e caldo: parla al cliente. Nella lista dei passi &ldquo;Il tuo veicolo&rdquo; si legge al volo.' },
    c: { nome: 'Dati del veicolo', titolo: 'I dati <span>dell&rsquo;autovettura</span>',
         dice: 'Neutro e preciso, da modulo. Va bene, ma &ldquo;dati&rdquo; &egrave; una parola un po&rsquo; da ufficio.' },
  }

  const viste = {}
  for (const k of ['a', 'b', 'c']) {
    const v = varianti[k]
    viste[k] = `<div class="spiega"><b>${v.nome}.</b> ${v.dice} Il contenuto della schermata &egrave; lo stesso nelle tre: cambia solo come si chiama il passo. Vale uguale per demolizione e valutazione.</div>
      ${pc(v.titolo, SOTTO, v.nome)}
      ${telefono(v.titolo, SOTTO, v.nome)}`
  }

  document.getElementById('viste').innerHTML = ['a','b','c'].map(k => `<div class="vista ${k === 'a' ? 'viva' : ''}" id="vista-${k}">${viste[k]}</div>`).join('')

  function vista(k, el) {
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('viva'))
    document.getElementById('vista-' + k).classList.add('viva')
    document.querySelectorAll('.schede span').forEach(s => s.classList.remove('qui'))
    el.classList.add('qui')
    window.scrollTo({ top: 0 })
  }
</script>
</body>
</html>
